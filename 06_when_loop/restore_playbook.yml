---
- name: Restore playbook.yml
  hosts: all
  gather_facts: true
  vars:
    db_pkgs:
      - mariadb
      - mariadb-server
      - python3-PyMySQL
    db_svc: mariadb
  tasks:
    - name: 2) 서비스 종료
      ansible.builtin.systemd:
        name: "{{ db_svc }}"
        state: stopped
        enabled: false
  
    - name: 1) 패키지 삭제
      ansible.builtin.dnf:
        name: "{{ item }}"
        state: absent
      loop: "{{ db_pkgs }}"
      when: ansible_facts["distribution"] == "CentOS"
   

    