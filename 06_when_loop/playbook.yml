---
##########################
# 1) 패키지 설치 - mariadb, mariadb-server, python3-PyMySQL
# 2) 서비스 기동 - mariadb
###########################

- name: 0) DB 서비스 기동 - loop 테스트
  hosts: database_prod
  gather_facts: true
  vars:
    db_pkgs:
      - mariadb
      - mariadb-server
      - python3-PyMySQL
    db_svc: mariadb
  tasks:
    - name: 1) 패키지 설치 - mariadb, mariadb-server, python3-PyMySQL
      ansible.builtin.dnf:
        name: "{{ item }}"
        state: present
      loop: "{{ db_pkgs }}"
      #when: ansible_facts["distribution"] == "CentOS"
      when: ansible_facts["distribution"] == "RedHat"

    - name: 2) 서비스 기동 - mariadb
      ansible.builtin.systemd_service:
        name: "{{ db_svc }}"
        state: started
        enabled: true