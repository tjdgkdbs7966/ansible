---
   ###################################
    # 1) 방화벽에 포트 제거 - http
    # 2) 서비스 내리기 - httpd.service
    # 3) 파일 삭제 - /var/www/html/index.html
    # 4) 패키지 삭제 - httpd
    ###################################
  - name: Restore site.yml
    hosts: all
    tasks:
      - name: 1) 방화멱 포트 제거 - firewalld(http)
        ansible.posix.firewalld:
          service: http
          state: disabled
          permanent: true
          immediate: true

      - name: 2) 웹서비스 stop - systemd_services(httpd)
        ansible.builtin.systemd_service:
          name: httpd
          state: stopped
          enabled: false
      - name: 3) /var/www/html/index.html 파일 제거 - files
        ansible.builtin.file:
          path: /var/www/html/index.html
          state: absent

      - name: 4) 패키지 삭제 -dnf/yum(httpd)
        ansible.builtin.dnf:
          name: httpd
          state: absent