---
#######################################
# 1) 패키지 설치 - httpd
# 2) 웹서버 설정 - /var/www/html/index.html
# 3) 웹서버 기동 - httpd.service
# 4) 방화벽 등록 - http(80/tcp)
# 5) SELinux(?)
########################################
- name: 0) 웹서버 설정
  hosts: webservers
  tasks:
      # 1) 패키지 설치 - httpd
    - name: 1) 패키지 설치 
      ansible.builtin.dnf:
        name: httpd
        state: present


    - name: 2) 웹 서버 설정 - (copy) /var/www/html/index.html
      ansible.builtin.copy:
        # scp files/index.html HOST:/var/www/html/index.html
        content: 'My WeB Server\n'
        dest: /var/www/html/index.html

    # 4) 방화벽 등록 - http(80/tcp)  
    - name: 4) 방화벽 등록
      ansible.posix.firewalld:
        service: http
        state: enabled
        permanent: true
        immediate: true


    
